<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vim Field Guide</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230f1115'/%3E%3Cpath d='M10 12 L20 29 L30 12' fill='none' stroke='%2357c96a' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='27' y='24' width='5' height='7' fill='%2357c96a'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230f1115'/%3E%3Cpath d='M10 12 L20 29 L30 12' fill='none' stroke='%2357c96a' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='27' y='24' width='5' height='7' fill='%2357c96a'/%3E%3C/svg%3E">
<meta name="description" content="A searchable reference to 606 Vim commands, compiled from the official help files, with before/after examples and links to the documentation.">
<style>
:root{
  --bg:#0f1115; --bg2:#151922; --bg3:#1b202b; --line:#252c3a;
  --fg:#d6dce6; --dim:#8b97ab; --key:#8ce99a; --accent:#57c96a;
  --accent2:#63b3ed; --mark:#f0c674; --shadow:0 12px 40px rgba(0,0,0,.55);
  --rowline:#1d2331;
}
:root[data-theme="light"]{
  --bg:#f7f8fa; --bg2:#ffffff; --bg3:#eef1f6; --line:#d9dee8;
  --fg:#1c2330; --dim:#5b6879; --key:#137a3a; --accent:#1f8f43;
  --accent2:#1d6fb8; --mark:#a56f00; --shadow:0 10px 34px rgba(20,30,50,.16);
  --rowline:#e8ecf3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.55 ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  -webkit-font-smoothing:antialiased}
a{color:var(--accent2)}
.wrap{max-width:none;margin:0;padding:0 18px}

/* header */
header{position:sticky;top:0;z-index:60;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex-shrink:0}
.brand{font-size:17px;font-weight:700;letter-spacing:.4px}
.brand small{display:block;font-size:9.5px;font-weight:400;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase}
.search{position:relative;flex:1;max-width:400px;min-width:130px;margin-left:auto}
.search input{width:100%;padding:8px 32px 8px 30px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg2);color:var(--fg);font:inherit;font-size:13.5px;outline:none;transition:border-color .18s,box-shadow .18s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:12.5px;pointer-events:none}
.search kbd{position:absolute;right:7px;top:50%;transform:translateY(-50%)}
kbd{background:var(--bg3);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-size:11px;color:var(--dim)}
.tbtn{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);color:var(--fg);
  border-radius:8px;padding:7px 11px;cursor:pointer;font:inherit;font-size:12px;white-space:nowrap;
  transition:transform .15s,border-color .18s;flex-shrink:0}
.tbtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.tbtn i{font-style:normal;color:var(--accent);font-size:13px}
.tbtn.icon{padding:7px 9px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg2);flex-shrink:0}
.seg button{background:none;border:none;color:var(--dim);font:inherit;font-size:12px;padding:7px 11px;
  cursor:pointer;transition:color .16s,background .16s;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--bg3);color:var(--accent)}
.count{font-size:11.5px;color:var(--dim);white-space:nowrap}

/* columns */
.cols{display:grid;gap:0 18px;align-items:start;padding:16px 0 40px}
.col{min-width:0}
section{margin:0 0 14px;display:block;width:100%}
.sh{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none;padding:11px 14px;margin-bottom:3px;
  background:color-mix(in srgb,var(--accent) 9%,var(--bg2));border:1px solid var(--line);
  border-radius:8px;transition:border-color .18s,background .18s}
.sh:hover{background:color-mix(in srgb,var(--accent) 16%,var(--bg2))}
.sh h2{margin:0;font-size:16.5px;font-weight:700;letter-spacing:.2px;color:var(--fg)}
.sh .n{margin-left:auto;font-size:11.5px;color:var(--accent);background:var(--bg);border:1px solid var(--line);
  border-radius:99px;padding:1px 9px}
.sh .caret{color:var(--dim);transition:transform .25s;font-size:11px}
section.closed .sh .caret{transform:rotate(-90deg)}
section.closed .body{display:none}
.note{color:var(--dim);font-size:12.5px;padding:9px 13px 4px;font-style:italic;line-height:1.5}

/* rows */
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  padding:7px 13px;border-bottom:1px solid var(--rowline);cursor:pointer;position:relative}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg2)}
.row .d{font-size:13.5px;line-height:1.5;display:flex;gap:7px;align-items:baseline;min-width:0;flex:1 1 auto}
.row .d>span{overflow-wrap:anywhere}
.row .cat{flex:0 0 auto;font-size:10.5px;color:var(--dim);border:1px solid var(--line);
  border-radius:4px;padding:0 5px;white-space:nowrap;opacity:.8}
.row .k{flex:0 0 auto;text-align:left;min-width:104px;color:var(--key);font-weight:600;font-size:13px;max-width:46%;
  background:var(--bg3);border:1px solid var(--line);border-radius:5px;padding:2px 8px;
  overflow-wrap:normal;word-break:keep-all;white-space:nowrap;transition:border-color .15s,color .15s}
.row .k.long{white-space:normal}
.row:hover .k{border-color:var(--accent);color:var(--accent)}
.doc{flex:0 0 auto;font-size:11px;color:var(--dim);text-decoration:none;border:1px solid var(--line);
  border-radius:4px;padding:0 5px;opacity:.55;transition:opacity .15s,color .15s,border-color .15s;align-self:center}
.row:hover .doc{opacity:1}
.doc:hover{color:var(--accent);border-color:var(--accent)}
.pin{flex:0 0 auto;font-style:normal;color:var(--accent);opacity:.45;font-size:12px;padding:0 3px;
  border-radius:4px;transition:opacity .15s,background .15s;align-self:center}
.row:hover .pin{opacity:.9}
.pin:hover{background:var(--bg3);opacity:1}
.row.open .pin{opacity:1;transform:rotate(90deg)}
.idemo{display:none;padding:9px 13px 12px 16px;border-bottom:1px solid var(--rowline);background:color-mix(in srgb,var(--bg2) 70%,transparent)}
.row.open+.idemo{display:block;animation:fadein .18s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.idemo .pair{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.idemo pre{flex:1 1 170px;margin:0;padding:5px 8px;background:var(--bg3);border:1px solid var(--line);
  border-radius:5px;font:12.5px/1.65 inherit;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg);min-width:0}
.idemo pre mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.idemo .ar{flex:0 0 auto;color:var(--accent);font-size:11px;opacity:.7}
.idemo .cap{font-size:12px;color:var(--dim);font-style:italic;margin-top:5px;line-height:1.5}
.idemo .cur{display:inline-block;width:2px;height:12px;background:var(--accent);vertical-align:-2px;margin:0 -1px;
  animation:blink 1.1s step-end infinite}
.row mark{background:color-mix(in srgb,var(--mark) 35%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.empty{padding:40px 12px;text-align:center;color:var(--dim)}

/* demo card */
#dcard{position:fixed;z-index:200;width:392px;max-width:calc(100vw - 24px);background:var(--bg2);
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:11px 13px 12px;
  opacity:0;transform:translateY(5px);pointer-events:none;transition:opacity .16s ease,transform .16s ease}
#dcard.on{opacity:1;transform:none}
#dcard .dk{font-size:12.5px;color:var(--accent);font-weight:700;margin-bottom:9px;display:flex;gap:10px;align-items:baseline;
  border-bottom:1px solid var(--line);padding-bottom:7px}
#dcard .pane{margin-bottom:7px}
#dcard .tag{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:3px}
#dcard pre{margin:0;padding:8px 10px;background:var(--bg3);border:1px solid var(--line);border-radius:6px;
  font:12.5px/1.7 inherit;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
#dcard pre mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:2px;padding:0 1px}
#dcard .cur{display:inline-block;width:2px;height:13px;background:var(--accent);vertical-align:-2px;
  margin:0 -1px;animation:blink 1.1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
#dcard .arrow{color:var(--dim);font-size:11px;text-align:center;margin:-2px 0 4px}
#dcard .dk small{margin-left:auto;font-size:10.5px;color:var(--dim);font-weight:400;font-style:normal}
#dcard .cap{font-size:11.5px;color:var(--dim);line-height:1.55;margin-top:8px;font-style:italic}

.top{position:fixed;right:16px;bottom:16px;width:38px;height:38px;border-radius:50%;background:var(--bg2);
  border:1px solid var(--line);color:var(--fg);cursor:pointer;display:grid;place-items:center;opacity:0;
  transform:translateY(10px);transition:opacity .25s,transform .25s,border-color .2s;box-shadow:var(--shadow);z-index:70}
.top.show{opacity:1;transform:none}
.top:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:700px){
  .cols{columns:1;padding-top:12px}
  .row{flex-direction:column;align-items:flex-start;gap:3px;padding:9px 13px}
  .row .k{max-width:100%;min-width:0;margin-left:0}
  .row .d{min-width:0;margin-left:2px}
  .bar{flex-wrap:wrap;gap:8px}
  .search{order:9;flex-basis:100%;max-width:none;margin-left:0}
  .count{order:10}
  #dcard{width:calc(100vw - 24px)}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  :root{--bg:#fff;--bg2:#fff;--bg3:#f4f6f9;--fg:#111;--dim:#555;--line:#bbb;--rowline:#ddd;--key:#0a5c2c;--accent:#0a5c2c}
  header,.top,#dcard,.doc,.pin{display:none!important}
  .cols{display:block!important;columns:2;column-gap:20px}
  section{break-inside:avoid}
  .idemo{display:none!important}
  body{font-size:10pt}
}
</style>
</head>
<body>

<header>
 <div class="wrap">
  <div class="bar">
    <a class="logo" href="#top">
      <svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="var(--accent)"/><stop offset="100%" stop-color="var(--accent2)"/></linearGradient></defs>
        <rect x="1.5" y="1.5" width="37" height="37" rx="9" fill="none" stroke="url(#g)" stroke-width="2.2"/>
        <path d="M10 12 L20 29 L30 12" fill="none" stroke="url(#g)" stroke-width="3.4" stroke-linecap="round"
              stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
          <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.1s" fill="freeze"
                   calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1"/></path>
        <rect x="27" y="24" width="5" height="7" fill="var(--accent)">
          <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite" begin="1.1s"/></rect>
      </svg>
      <span class="brand">Vim Field Guide<small>Command reference</small></span>
    </a>
    <div class="seg" role="group" aria-label="Group by">
      <button id="gf" aria-pressed="true">By function</button>
      <button id="gt" aria-pressed="false">By frequency</button>
    </div>
    <div class="search">
      <span class="ic">/</span>
      <input id="q" type="search" aria-label="Search commands" placeholder="Search commands and descriptions" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
    <span class="count" id="count"></span>
    <button class="tbtn" id="expand"><i>⇕</i><span id="expand-t">collapse all</span></button>
    <button class="tbtn icon" id="theme" title="Light / dark theme"><i>◐</i></button>
  </div>
 </div>
</header>

<main class="wrap" id="top"><div class="cols" id="out"></div></main>

<button class="top" id="top-btn" title="Back to top">↑</button>
<div id="dcard" aria-hidden="true"></div>

<script>
const SECTIONS = [
{id:'survival',title:'Modes & Core Commands',icon:'◈',note:'Mode changes, writing and quitting, and the two commands on which undo and repeat depend.',items:[
['Esc','Back to Normal mode (the home base)','essential','insert.txt#i_<Esc>'],
['<C-[>','Same as Esc, easier to reach','daily','insert.txt#i_CTRL-['],
['i / a','Insert before / after cursor','essential','insert.txt'],
['I / A','Insert at first non-blank / end of line','essential','insert.txt#I'],
['o / O','Open new line below / above and insert','essential','insert.txt#o'],
['v / V / <C-v>','Visual char / line / block mode','essential','visual.txt#v'],
['R','Replace mode (overtype)','daily','change.txt#R'],
['gi','Insert exactly where you last left insert mode','daily','insert.txt#gi'],
[':w / :q / :wq / :q!','Write / quit / write+quit / quit discarding','essential','editing.txt#:wq'],
['ZZ / ZQ','Write+quit / quit without saving','essential','editing.txt#ZZ'],
[':w !sudo tee %','Write a root-owned file opened without sudo','daily','editing.txt#:w_c'],
['u / <C-r>','Undo / redo','essential','undo.txt'],
['.','Repeat the last change','essential','repeat.txt#.'],
[':h <topic>','Open help. <C-]> follows a link, <C-o> goes back','essential','helphelp.txt#:help'],
[':h index','Every command in every mode, in one file','rare','index.txt#index'],
['<C-c>','Abort a command / interrupt a running search','daily','pattern.txt#CTRL-C'],
['<C-g>','Show file name, position and status','daily','editing.txt#CTRL-G'],
['g<C-g>','Word, line, character and byte count for the file or selection','rare','editing.txt#g_CTRL-G']
]},

{id:'motion',title:'Motions',icon:'➜',note:'Every motion also serves as an operator target: d, c or y followed by the motion.',items:[
['h j k l','Left, down, up, right','essential','motion.txt#h'],
['w / W','Next word start / WORD start (WORD = space-separated)','essential','motion.txt#w'],
['e / E','Next word end / WORD end','essential','motion.txt#e'],
['b / B','Previous word start / WORD start','essential','motion.txt#b'],
['ge / gE','Previous word end','rare','motion.txt#ge'],
['0 / ^ / $','Line start / first non-blank / line end','essential','motion.txt#0'],
['g_','Last non-blank character of the line','rare','motion.txt#g_'],
['g0 / g$','Start / end of the screen line (wrapped text)','rare','motion.txt#g0'],
['gj / gk','Down / up by screen line, not by real line','daily','motion.txt#gj'],
['f{c} / F{c}','Jump to next / previous {c} on this line','essential','motion.txt#f'],
['t{c} / T{c}','Jump just before next / after previous {c}','essential','motion.txt#t'],
[';  /  ,','Repeat last f/t forward / backward','essential','motion.txt#;'],
['gg / G','First line / last line','essential','motion.txt#gg'],
['{n}G  or  :{n}','Go to line n','essential','motion.txt#G'],
['{n}%','Go to n percent through the file','rare','motion.txt#N%'],
['H / M / L','Top / middle / bottom of the visible screen','daily','motion.txt#H'],
['{ / }','Previous / next blank-line paragraph','essential','motion.txt#{'],
['( / )','Previous / next sentence','rare','motion.txt#('],
['[[ / ]]','Previous / next section or function start (col-1 \'{\')','daily','motion.txt#[['],
['[{ / ]}','Jump to the enclosing { or }','daily','motion.txt#[{'],
['[( / ])','Jump to the enclosing ( or )','rare','motion.txt#[('],
['[m / ]m','Previous / next method start (Java-like languages)','rare','motion.txt#[m'],
['%','Jump to matching bracket, and with matchit to matching tag/keyword','essential','motion.txt#%'],
['*  /  #','Search forward / backward for the word under the cursor','essential','pattern.txt#star'],
['g* / g#','Same, but match as substring (no word boundaries)','rare','pattern.txt#gstar'],
['<C-o> / <C-i>','Jump back / forward through the jump list','essential','motion.txt#CTRL-O'],
['``  /  \'\'','Back to position / line before the last jump','daily','motion.txt#``'],
['`.  /  \'.','Jump to the position of the last change','daily','motion.txt#`.'],
['g;  /  g,','Older / newer position in the change list','daily','motion.txt#g;'],
['zz / zt / zb','Redraw with cursor line centered / at top / at bottom','essential','scroll.txt#zz'],
['<C-e> / <C-y>','Scroll one line down / up without moving cursor','daily','scroll.txt#CTRL-E'],
['<C-d> / <C-u>','Scroll half a page down / up','essential','scroll.txt#CTRL-D'],
['<C-f> / <C-b>','Page forward / back','essential','scroll.txt#CTRL-F'],
['zh / zl','Scroll sideways one char (nowrap)','rare','scroll.txt#zh'],
['zs / ze','Scroll so cursor is at screen start / end','rare','scroll.txt#zs'],
['|','Go to column 1; {n}| goes to column n','rare','motion.txt#bar'],
['_','First non-blank, n lines down','rare','motion.txt#_'],
['+ / -','First non-blank of next / previous line','rare','motion.txt#+'],
['gm','Half a screen width right on the screen line','rare','motion.txt#gm'],
['go','Go to byte n in the buffer','rare','motion.txt#go'],
['gd / gD','Go to local / global declaration of the word under cursor','daily','pattern.txt#gd'],
[']s / [s','Next / previous misspelled word','rare','spell.txt#]s'],
['<C-]>','Jump to the tag (definition) under the cursor','essential','tagsrch.txt#CTRL-]']
]},

{id:'objects',title:'Text Objects',icon:'▣',note:'Used after an operator (d, c, y) or in Visual mode. i selects the contents, a includes the delimiters.',items:[
['iw / aw','Inner word / a word plus trailing space','essential','motion.txt#v_iw'],
['iW / aW','Inner WORD / a WORD (space-separated)','daily','motion.txt#v_iW'],
['is / as','Inner / a sentence','rare','motion.txt#v_is'],
['ip / ap','Inner / a paragraph','essential','motion.txt#v_ip'],
['i" / a"','Inside / around double quotes','essential','motion.txt#v_iquote'],
['i\' / a\'','Inside / around single quotes','daily','motion.txt#v_iquote'],
['i` / a`','Inside / around backticks','rare','motion.txt#v_iquote'],
['i( i) ib','Inside parentheses','essential','motion.txt#v_ib'],
['a( a) ab','Around parentheses (includes them)','essential','motion.txt#v_ab'],
['i{ i} iB','Inside curly braces','essential','motion.txt#v_iB'],
['a{ a} aB','Around curly braces','essential','motion.txt#v_aB'],
['i[ i]  /  a[ a]','Inside / around square brackets','daily','motion.txt#v_i['],
['i< i>  /  a< a>','Inside / around angle brackets','rare','motion.txt#v_i<'],
['it / at','Inside / around an XML/HTML tag pair','daily','motion.txt#v_it'],
['ci"','Change the text inside the quotes','essential','motion.txt#v_iquote'],
['di(','Delete inside the parens, keep the parens','essential','motion.txt#v_ib'],
['ya{','Yank the whole brace block including braces','rare','motion.txt#v_aB'],
['dap','Delete a paragraph plus its trailing blank line','daily','motion.txt#v_ap'],
['cit','Replace the contents of an HTML tag','daily','motion.txt#v_it'],
['vi{V','Select brace contents, then extend to whole lines','rare','motion.txt#v_iB'],
['2i{ / 2a{','Count works: the second enclosing block outwards','rare','motion.txt#v_iB'],
['gn','Select the next search match — then c/d/y it, repeat with .','daily','visual.txt#gn'],
['gN','Same, backwards','rare','visual.txt#gN']
]},

{id:'edit',title:'Operators & Changes',icon:'✎',note:'Syntax: {count}{operator}{motion or text object}. Doubling the operator applies it to the whole line.',items:[
['x / X','Delete char under / before cursor','essential','change.txt#x'],
['d{motion}','Delete over the motion','essential','change.txt#d'],
['dd / D','Delete line / delete to end of line','essential','change.txt#dd'],
['c{motion}','Change (delete and enter insert)','essential','change.txt#c'],
['cc / C','Change whole line / to end of line','essential','change.txt#cc'],
['s / S','Substitute char / whole line','essential','change.txt#s'],
['y{motion} / yy / Y','Yank (copy) motion / line','essential','change.txt#yy'],
['p / P','Put after / before cursor (linewise if yanked linewise)','essential','change.txt#p'],
['gp / gP','Put and leave cursor after the pasted text','rare','change.txt#gp'],
[']p','Put linewise, adjusting indent to the current line','rare','change.txt#]p'],
['r{c} / gr{c}','Replace one char without entering insert mode','essential','change.txt#r'],
['~','Toggle case of the character under the cursor','rare','change.txt#~'],
['g~{motion} / g~~','Toggle case over motion / line','rare','change.txt#g~'],
['gu{motion} / gU{motion}','Lowercase / uppercase over motion','daily','change.txt#gu'],
['gUiw','Uppercase the current word','daily','change.txt#gU'],

const TIERS = [
  {id:'essential', title:'Essential', icon:'', note:'Approximately one hundred commands that account for most routine editing. Recommended before the rest.'},
  {id:'daily',     title:'Daily use', icon:'', note:'Commands that repay learning once the essentials are automatic.'},
  {id:'rare',      title:'Rare',      icon:'', note:'The long tail: intended for lookup rather than memorisation.'}
];

const ITEMS = [];
SECTIONS.forEach(s => s.items.forEach(it => ITEMS.push({
  sec:s.id, cat:s.title.split(' — ')[0].split(' (')[0], key:it[0], desc:it[1], tier:it[2], doc:it[3],
  demo:DEMOS[s.id + '::' + it[0]] || null,
  kl:it[0].toLowerCase(), dl:it[1].toLowerCase(), sl:s.title.toLowerCase()
})));
const TOTAL = ITEMS.length;

const docURL = d => {
  const i = d.indexOf('#');
  return 'https://vimhelp.org/' + (i < 0 ? d : d.slice(0, i)) + '.html' +
         (i < 0 ? '' : '#' + encodeURIComponent(d.slice(i + 1)));
};
const docTag = d => { const i = d.indexOf('#'); return i < 0 ? d : d.slice(i + 1); };

const out = document.getElementById('out'), countEl = document.getElementById('count'), q = document.getElementById('q');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl = (raw, term) => {
  if (!term) return esc(raw);
  const i = raw.toLowerCase().indexOf(term);
  return i < 0 ? esc(raw)
    : esc(raw.slice(0,i)) + '<mark>' + esc(raw.slice(i,i+term.length)) + '</mark>' + esc(raw.slice(i+term.length));
};
/* ‸ = cursor, «…» = affected text */
const demoLine = raw => esc(raw)
  .replace(/«/g,'\u0001').replace(/»/g,'\u0002')
  .replace(/\u0001([^\u0002]*)\u0002/g,'<mark>$1</mark>')
  .replace(/[\u0001\u0002]/g,'')
  .replace(/‸/g,'<span class="cur"></span>');

let mode = 'function', collapsed = false;
try { mode = localStorage.getItem('vfg-group') || 'function'; } catch(e) {}

const groups = () => mode === 'function'
  ? SECTIONS.map(s => ({id:s.id, title:s.title, icon:s.icon, note:s.note, items:ITEMS.filter(i => i.sec === s.id)}))
  : TIERS.map(t => ({id:t.id, title:t.title, icon:t.icon, note:t.note, items:ITEMS.filter(i => i.tier === t.id)}));

const COLW = 520, GAP = 18;
let blocks = [], lastK = 0;

function layout(force) {
  const K = Math.max(1, Math.floor((out.clientWidth + GAP) / (COLW + GAP)));
  if (!force && K === lastK && out.children.length) return;
  lastK = K;
  out.style.gridTemplateColumns = 'repeat(' + K + ',minmax(0,1fr))';
  out.innerHTML = '';
  if (!blocks.length) { out.innerHTML = emptyHTML; out.style.gridTemplateColumns = '1fr'; return; }
  const cols = [];
  for (let i = 0; i < K; i++) {
    const d = document.createElement('div');
    d.className = 'col';
    out.appendChild(d);
    cols.push(d);
  }
  // place each group whole, into whichever column is currently shortest
  blocks.forEach(html => {
    let min = 0;
    for (let i = 1; i < K; i++) if (cols[i].offsetHeight < cols[min].offsetHeight) min = i;
    cols[min].insertAdjacentHTML('beforeend', html);
  });
}

let emptyHTML = '';

function render() {
  const term = q.value.trim().toLowerCase();
  let shown = 0;
  blocks = [];
  groups().forEach(g => {
    const hits = g.items.filter(i => !term || i.kl.includes(term) || i.dl.includes(term) ||
                                     g.title.toLowerCase().includes(term) || i.sl.includes(term));
    if (!hits.length) return;
    shown += hits.length;
    blocks.push('<section id="' + g.id + '"' + ((collapsed && !term) ? ' class="closed"' : '') + '>' +
      '<div class="sh"><h2>' + esc(g.title) + '</h2>' +
      '<span class="n">' + hits.length + '</span><span class="caret">▼</span></div><div class="body">' +
      (g.note ? '<div class="note">' + esc(g.note) + '</div>' : '') +
      hits.map(i =>
        '<div class="row' + (i.demo ? ' hasdemo' : '') + '" data-id="' + ITEMS.indexOf(i) + '">' +
        '<span class="k' + (i.key.length > 17 ? ' long' : '') + '">' + hl(i.key, term) + '</span>' +
        '<span class="d"><span>' + hl(i.desc, term) + '</span>' +
        (mode === 'frequency' ? '<i class="cat">' + esc(i.cat) + '</i>' : '') + '</span>' +
        (i.demo ? '<i class="pin" title="Show the example below this row">▸</i>' : '') +
        '<a class="doc" href="' + docURL(i.doc) + '" target="_blank" rel="noopener"' +
        ' title="Documentation: :help ' + esc(docTag(i.doc)) + '">?</a></div>' +
        (i.demo ? inlineDemo(i) : '')).join('') +
      '</div></section>');
  });
  emptyHTML = '<div class="empty">No results for “' + esc(q.value) +
    '”. Try a broader term, for example <em>split</em>, <em>register</em>, <em>fold</em>, ' +
    '<em>quickfix</em>, <em>macro</em> or <em>indent</em>.</div>';
  countEl.textContent = term ? shown + ' of ' + TOTAL : TOTAL + ' commands';
  layout(true);
}

let rt = null;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => layout(false), 140); });

function inlineDemo(i) {
  const [before, after, cap] = i.demo;
  return '<div class="idemo"><div class="pair"><pre>' + demoLine(before) + '</pre>' +
    (after ? '<span class="ar">▸</span><pre>' + demoLine(after) + '</pre>' : '') + '</div>' +
    (cap ? '<div class="cap">' + esc(cap) + '</div>' : '') + '</div>';
}

/* ---------- demo card ---------- */
const card = document.getElementById('dcard');
let hideT = null, showT = null;
function showCard(row) {
  const it = ITEMS[+row.dataset.id];
  if (!it || !it.demo || row.classList.contains('open')) return;
  const [before, after, cap] = it.demo;
  card.innerHTML = '<div class="dk">' + esc(it.key) +
    '<small>:help ' + esc(docTag(it.doc)) + '</small></div>' +
    '<div class="pane"><span class="tag">Before</span><pre>' + demoLine(before) + '</pre></div>' +
    (after ? '<div class="arrow">▼</div><div class="pane"><span class="tag">After</span><pre>' +
             demoLine(after) + '</pre></div>' : '') +
    (cap ? '<div class="cap">' + esc(cap) + '</div>' : '');
  card.classList.add('on');
  const r = row.getBoundingClientRect(), cw = card.offsetWidth, ch = card.offsetHeight;
  let left = r.right + 14;
  if (left + cw > innerWidth - 10) left = r.left - cw - 14;
  if (left < 10) left = Math.max(10, Math.min(r.left, innerWidth - cw - 10));
  let top = r.top - 8;
  if (top + ch > innerHeight - 10) top = innerHeight - ch - 10;
  card.style.left = left + 'px';
  card.style.top = Math.max(10, top) + 'px';
}
const hideCard = () => card.classList.remove('on');

out.addEventListener('mouseover', e => {
  const row = e.target.closest('.row');
  if (!row || !row.classList.contains('hasdemo')) { clearTimeout(showT); hideT = setTimeout(hideCard, 90); return; }
  clearTimeout(hideT); clearTimeout(showT);
  showT = setTimeout(() => showCard(row), 110);
});
out.addEventListener('mouseleave', () => { clearTimeout(showT); hideCard(); });
addEventListener('scroll', hideCard, {passive:true});

/* ---------- click: copy (and show demo on touch) ---------- */
out.addEventListener('click', e => {
  if (e.target.closest('.doc')) return;          // let the help link open
  const sh = e.target.closest('.sh');
  if (sh) { sh.parentElement.classList.toggle('closed'); hideCard(); return; }
  const row = e.target.closest('.row');
  if (!row || !row.classList.contains('hasdemo')) return;
  row.classList.toggle('open');                  // click reveals the demo under the row
  hideCard();
});
document.body.addEventListener('click', e => { if (!e.target.closest('.row')) hideCard(); });

/* ---------- controls ---------- */
q.addEventListener('input', () => { hideCard(); render(); });

const gf = document.getElementById('gf'), gt = document.getElementById('gt');
const expandT = document.getElementById('expand-t');
function setMode(m) {
  mode = m; collapsed = false; expandT.textContent = 'collapse all';
  gf.setAttribute('aria-pressed', m === 'function');
  gt.setAttribute('aria-pressed', m === 'frequency');
  try { localStorage.setItem('vfg-group', m); } catch(e) {}
  render();
}
gf.onclick = () => setMode('function');
gt.onclick = () => setMode('frequency');

document.getElementById('expand').onclick = () => {
  collapsed = !collapsed;
  expandT.textContent = collapsed ? 'expand all' : 'collapse all';
  hideCard();
  render();               // rebuild so the fold state survives re-balancing
};

const root = document.documentElement;
try { const t = localStorage.getItem('vfg-theme'); if (t) root.dataset.theme = t; } catch(e) {}
document.getElementById('theme').onclick = () => {
  root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('vfg-theme', root.dataset.theme); } catch(e) {}
};

addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
  if (e.key === 'Escape') { hideCard(); if (document.activeElement === q) { q.value=''; render(); q.blur(); } }
});

const topBtn = document.getElementById('top-btn');
addEventListener('scroll', () => topBtn.classList.toggle('show', scrollY > 700), {passive:true});
topBtn.onclick = () => scrollTo({top:0, behavior:'smooth'});

setMode(mode);
</script>
</body>
</html>
